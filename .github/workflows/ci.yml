name: ci

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python3 -m pip install --break-system-packages pytest 'libtools @ git+https://github.com/OpenSourceEcology/vcs-library'
      - name: Run unit tests
        run: python3 -m pytest -q

  freecad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FreeCAD
        run: |
          sudo add-apt-repository -y ppa:freecad-maintainers/freecad-stable
          sudo apt-get update -qq
          sudo apt-get install -y -qq freecad xvfb xauth
          command -v freecadcmd
      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages 'libtools @ git+https://github.com/OpenSourceEcology/vcs-library'
      - name: Clone reference library
        run: git clone --depth 1 https://github.com/OpenSourceEcology/vcs-library /tmp/vcs-library
      - name: Run FreeCAD round trip
        env:
          OSE_WB_ROOT: ${{ github.workspace }}
          OSE_LIBRARY_ROOT: /tmp/vcs-library
          OSE_REPORT_OUT: ${{ github.workspace }}/reports/workbench-integration.json
        run: |
          export OSE_WB_LIBTOOLS_PATH="$(python3 -c 'import pathlib, libtools; print(pathlib.Path(libtools.__file__).resolve().parent.parent)')"
          freecadcmd .github/workflows/freecad_roundtrip.py
      - name: Assert report shape
        run: python3 .github/workflows/assert_report.py reports/workbench-integration.json
      - name: Exercise GUI commands and parameter dialog
        env:
          OSE_WB_ROOT: ${{ github.workspace }}
          OSE_LIBRARY_ROOT: /tmp/vcs-library
          OSE_GUI_REPORT_OUT: ${{ github.workspace }}/reports/gui-integration.json
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          export OSE_WB_LIBTOOLS_PATH="$(python3 -c 'import pathlib, libtools; print(pathlib.Path(libtools.__file__).resolve().parent.parent)')"
          xvfb-run -a timeout 90s freecad -u "$RUNNER_TEMP/ose-wb-gui.cfg" "$GITHUB_WORKSPACE/.github/workflows/gui_roundtrip.FCMacro"
          python3 .github/workflows/assert_gui_report.py reports/gui-integration.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freecad-validation-report
          path: reports/
